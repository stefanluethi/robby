[project]
name = "robby-bench"
version = "0.1.0"
description = "Throughput measurements of the robby trace link: capture, load ramp and report over the blip WebSocket"
authors = [
    { name = "Stefan Lüthi", email = "stefan.luethi@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cbor2>=6.1.5",
    "websockets>=17.3",
]

[project.scripts]
bench-capture = "robby_bench.capture:main"
bench-ramp = "robby_bench.ramp:main"
bench-report = "robby_bench.report:main"
bench-decode = "robby_bench.decode:main"
bench-simulate = "robby_bench.sim:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ANN", "PT", "RET", "PL"]
# CBOR data is dynamic (ANN401); "×" and "–" in the markdown are wanted (RUF001)
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415", "ANN401", "RUF001",
    "SIM115",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR2004", "PLR0917"]

[tool.mypy]
strict = true
files = ["src", "tests", "capture.py", "ramp.py", "report.py", "decode.py", "simulate.py"]

[[tool.mypy.overrides]]
module = ["cbor2", "cbor2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
