# micropb-gen config for robby_link.proto, applied to the package `.robby.link` by
# Generator::compile_protos_with_config_files (it finds this file next to the .proto).
# Fixed-capacity heapless 0.9 containers, no heap. Keep the limits in sync with
# robby_link.options (nanopb).

# Containers for the whole package (what Generator::use_container_heapless() sets)
["."]
vec_type = "::heapless::Vec<$T, $N>"
string_type = "::heapless::String<$N>"
bytes_type = "::heapless::Vec<u8, $N>"
map_type = "::heapless::index_map::FnvIndexMap<$K, $V, $N>"

["Uplink.records"]
max_len = 32

# int16 raw counts on the STM32
["ImuBatch.x"]
max_len = 100
int_size = "S16"
["ImuBatch.y"]
max_len = 100
int_size = "S16"
["ImuBatch.z"]
max_len = 100
int_size = "S16"
["Synthetic.x"]
max_len = 100
int_size = "S16"
["Synthetic.y"]
max_len = 100
int_size = "S16"
["Synthetic.z"]
max_len = 100
int_size = "S16"

["DistanceImage.mm"]
max_len = 192
int_size = "S16"

# Without the NUL that nanopb's max_size counts
["TaskStats.name"]
max_bytes = 15
["LogRecord.message"]
max_bytes = 255
["ActionResult.error"]
max_bytes = 63
