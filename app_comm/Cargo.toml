[package]
name = "proto-bride"
version = "0.1.0"
authors = ["Stefan Lüthi <stefan.luethi@outlook.com>"]
edition = "2021"
resolver = "2"

[[bin]]
name = "proto-bride"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

experimental = []

[dependencies]
log = "0.4"
anyhow = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false }
proto = { version = "*", path = "../app_web/proto" }
cobs = { version = "0.5.1", default-features = false }

esp-hal = { version = "1.1.1", features = ["esp32c6", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32c6", "esp-radio", "esp-alloc"] }
esp-radio = { version = "0.18.0", features = ["esp32c6", "wifi", "esp-alloc"] }
esp-alloc = { version = "0.10.0" }
esp-backtrace = { version = "0.19.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.17.0", default-features = false, features = ["esp32c6", "uart"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "medium-ethernet"] }
embassy-sync = "0.8.0"

embedded-websocket = { version = "0.9.5", default-features = false }
embedded-io-async = "0.6.1"
heapless = "0.9"
