[workspace]
members = ["outpost-core"]

[package]
name = "robby-outpost"
version = "0.1.0"
authors = ["Stefan Lüthi <stefan.luethi@outlook.com>"]
edition = "2021"
resolver = "2"

[[bin]]
name = "robby-outpost"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

experimental = []
# No UART: the outpost generates `bench/synthetic` samples itself at the rate of the
# `bench/load` action, to measure the WiFi/TCP limit of the ESP32-C6 alone
bench-wifi = []

[dependencies]
log = "0.4"
critical-section = "1.2"

esp-hal = { version = "1.1.1", features = ["esp32c6", "unstable", "log-04"] }
esp-rtos = { version = "0.3.0", features = ["esp32c6", "esp-radio", "esp-alloc", "embassy"] }
esp-radio = { version = "0.18.0", features = ["esp32c6", "wifi", "esp-alloc", "log-04"] }
esp-alloc = { version = "0.10.0" }
esp-backtrace = { version = "0.19.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["esp32c6", "log-04"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "medium-ethernet", "log"] }
embassy-sync = "0.8.0"

embedded-websocket = { version = "0.9.5", default-features = false }
embedded-io-async = "0.7.0"
heapless = "0.9"
static_cell = "2.1.1"
embassy-futures = "0.1.2"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6", "log-04"] }
outpost-core = { path = "outpost-core" }
