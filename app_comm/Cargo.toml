[package]
name = "proto-bride"
version = "0.1.0"
authors = ["Stefan Lüthi <stefan.luethi@outlook.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "proto-bride"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
esp-idf-svc = "0.52"
esp-idf-hal = { version = "0.46", default-features = false }
embedded-svc = { version = "0.29", default-features = false }
anyhow = "1"
serde = { version = "1.0", default-features = false }
postcard = { version = "1.1", features = ["alloc"] }
proto = { version = "*", path = "../app_web/proto" }
cobs = { version = "0.5.1", default-features = false }

[build-dependencies]
embuild = "0.33"
