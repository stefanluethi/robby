[package]
name = "outpost-core"
description = "Translates the robby protobuf link to blip messages, no_std and host-testable"
version = "0.1.0"
authors = ["Stefan Lüthi <stefan.luethi@outlook.com>"]
edition = "2021"

[dependencies]
micropb = { version = "0.7", default-features = false, features = ["encode", "decode", "enable-64bit", "container-heapless-0-9"] }
heapless = "0.9"
minicbor = { version = "2.3", default-features = false, features = ["half"] }
half = { version = "2.7", default-features = false }

[build-dependencies]
micropb-gen = "0.7"

[dev-dependencies]
proto = { git = "https://github.com/stefanluethi/blip.git", rev = "ee43dc1" }
serde_cbor_2 = "0.13.0"
serde_json = "1"
